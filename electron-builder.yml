appId: com.novopharma.app
productName: NovoPharma
directories:
  output: release
  buildResources: build
files:
  - out/**/*
extraResources:
  - from: src/renderer/src/assets/medicine_directory.json
    to: medicine_directory.json
win:
  icon: build/icon.ico
  target: nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: Aleem02
  repo: novopharma
  releaseType: release
